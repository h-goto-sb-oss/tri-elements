<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TRI-ELEMENTS ／ 三属の戦記</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#01295d">
<!-- 直したはずの不具合が直っていない、の多くは古い index.html が
     端末に残っているせい。この文書だけは毎回サーバーに確認しに行かせる。
     （中身のJSやCSSはファイル名に印がつくので、いくらでもキャッシュしてよい） -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="/tri-elements/assets/icon-192-CTdmHVMQ.png">
<link rel="apple-touch-icon" href="/tri-elements/assets/icon-192-CTdmHVMQ.png">
<!-- 読み込み画面。ゲームが最初の画面を描くまでの間に出す（JS を待たずに出るよう HTML に直接書く）。
     タイトル画面と同じ背景とロゴにして、そのままタイトルへつながって見えるようにする -->
<style>
  html,body{background:#0b0d16;margin:0}
  .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 20px;
    background:#0b0d16 center 48%/cover no-repeat;color:#f1e6c8;font:600 14px/1.5 system-ui,"Hiragino Sans","Yu Gothic",sans-serif;text-align:center}
  .boot::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,#0b0d1655 0,#0b0d16d9 75%)}
  .boot>*{position:relative}
  .boot img{width:min(460px,78vw);filter:drop-shadow(0 4px 12px #000c);opacity:0;transition:opacity .4s}
  .boot img.on{opacity:1}
  .boot .bootbar{width:min(300px,64vw);height:6px;border-radius:99px;background:#ffffff1f;overflow:hidden}
  .boot .bootbar span{display:block;width:40%;height:100%;border-radius:99px;background:linear-gradient(90deg,#e0703a,#3aa0e0,#4cc15a);animation:bootbar 1.3s ease-in-out infinite}
  @keyframes bootbar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  .boot .tip{min-height:3em;max-width:520px;color:#e8dcbc;text-shadow:0 1px 4px #000}
  .boot .tip small{display:block;color:#d9b25f;font-size:11px;letter-spacing:.14em;margin-bottom:2px}
  @media (prefers-reduced-motion:reduce){.boot .bootbar span{animation:none;width:100%}}
</style>
  <script type="module" crossorigin src="/tri-elements/assets/index-DZcTsYcB.js"></script>
  <link rel="stylesheet" crossorigin href="/tri-elements/assets/index-B3GOZaog.css">
</head>
<body>
<div id="app"><div class="boot" id="boot"><img id="bootlogo" alt="TRI-ELEMENTS"><div class="bootbar"><span></span></div><div class="tip" id="boottip"></div></div></div>
<script>
  // 背景・ロゴは、置き場所（GitHub のサブフォルダ・itch・CrazyGames）に関係なく、このページから見た場所で読む
  (function () {
    var ja = /^ja/i.test(navigator.language || '');
    try { var st = localStorage.getItem('tri-elements-lang'); if (st) ja = st === 'ja'; } catch (e) {}
    var at = function (p) { return new URL(p, location.href).href; };
    var boot = document.getElementById('boot'), logo = document.getElementById('bootlogo'), tip = document.getElementById('boottip');
    boot.style.backgroundImage = 'url(' + at('assets/backgrounds/title-bg.webp') + ')';
    logo.onload = function () { logo.className = 'on'; };
    logo.src = at((ja ? 'assets/ui/title-logo.' : 'assets/ui/title-logo-en.') + ('production' === 'freem' ? 'png' : 'svg'));   // ふりーむ！版は svg が使えない
    var tips = ja ? [
      '炎は草に、草は水に、水は炎に強い。有利な属性で攻撃すると攻撃力+2。',
      '防御モードのモンスターは攻撃できないが、防御力のぶんダメージを受け止める。',
      '【守護】を持つモンスターがいると、相手はまずそれを倒さないといけない。',
      '相手の場が空なら、プレイヤーに直接攻撃できる。',
      '今日の選定の儀は、全員が同じカード・同じ相手。毎日ランキングで競える。',
      '水曜と土曜は特別ルールの日。3位までに絵違いカードの景品がある。'
    ] : [
      'Fire beats Grass, Grass beats Water, Water beats Fire. Attacking with the advantage gives +2 ATK.',
      'Monsters in Defense Mode can’t attack, but they absorb damage up to their DEF.',
      'While an enemy has a [Guard] monster, you must defeat it first.',
      'If the enemy field is empty, you can attack the player directly.',
      'In the Daily Rite, everyone gets the same cards and rivals — compete on the ranking.',
      'Wednesdays and Saturdays are special rule days. The top 3 win an alternate-art card.'
    ];
    var n = Math.floor(Math.random() * tips.length);
    var show = function () { if (!document.getElementById('boottip')) return; tip.innerHTML = '<small>TIPS</small>' + tips[n++ % tips.length]; setTimeout(show, 3500); };
    show();
  })();
</script>
</body>
</html>
