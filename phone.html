<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スマホ表示 ／ TRI-ELEMENTS</title>
<!-- 作者の確認用（10/29）：PC の画面の大きさはそのままで、ゲームをスマホと同じ大きさ（中にもう1つ開く）で動かす。
     中のゲームは同じ場所のデータ（セーブ）を使う。ゲームの左下の「スマホ表示」（作者の PC だけに出る）から来る -->
<style>
  :root{--bg:#0a0f1c;--bar:#121a2e;--line:#2a3554;--ink:#dfe7f5;--sub:#8fa0bf;--on:#e3b04a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif}
  body{display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;background:var(--bar);border-bottom:1px solid var(--line)}
  .bar b{font-size:14px;margin-right:6px}
  .bar button,.bar a{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:#1c2742;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;text-decoration:none}
  .bar button.on{border-color:var(--on);color:var(--on)}
  .bar .sp{flex:1}
  .bar small{color:var(--sub);font-size:12px}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px}
  .box{position:relative}
  .phone{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:22px;padding:10px;background:#000;box-shadow:0 0 0 2px #333,0 18px 40px #000c}
  iframe{display:block;border:0;border-radius:12px;background:#000}
</style>
</head>
<body>
<div class="bar">
  <b>スマホ表示</b>
  <span id="sizes"></span>
  <button id="reload" title="中のゲームを読み直す">読み直す</button>
  <span class="sp"></span>
  <small id="info"></small>
  <a href="./">PCの表示に戻る</a>
</div>
<div class="stage" id="stage"><div class="box" id="box"><div class="phone" id="phone"><iframe id="fr" title="TRI-ELEMENTS" allow="autoplay; fullscreen"></iframe></div></div></div>
<script>
  // 大きさ：412×915（ふつうのAndroid）・360×800（小さめ）・横向き
  const SIZES = [
    { k: '412', w: 412, h: 915, label: '412×915' },
    { k: '360', w: 360, h: 800, label: '360×800（小さめ）' },
    { k: 'yoko', w: 915, h: 412, label: '横向き 915×412' },
  ];
  const get = () => { try { return localStorage.getItem('te-phonesize') || '412'; } catch { return '412'; } };
  const set = v => { try { localStorage.setItem('te-phonesize', v); } catch { /* 覚えられなくても動く */ } };
  const fr = document.getElementById('fr'), phone = document.getElementById('phone'), box = document.getElementById('box'), stage = document.getElementById('stage');
  let cur = SIZES.find(s => s.k === get()) || SIZES[0];
  const PAD = 10;
  function fit() {
    fr.style.width = cur.w + 'px'; fr.style.height = cur.h + 'px';
    const W = cur.w + PAD * 2, H = cur.h + PAD * 2;
    const r = stage.getBoundingClientRect();
    // 画面に入りきらないときは、見た目だけ縮める（中のゲームは cur.w × cur.h のまま＝スマホと同じ並びになる）
    const k = Math.min(1, (r.width - 24) / W, (r.height - 24) / H);
    phone.style.transform = `scale(${k})`;
    box.style.width = W * k + 'px'; box.style.height = H * k + 'px';
    document.getElementById('info').textContent = `中の画面 ${cur.w}×${cur.h}` + (k < 1 ? `（${Math.round(k * 100)}%に縮めて表示）` : '');
    document.querySelectorAll('#sizes button').forEach(b => b.classList.toggle('on', b.dataset.k === cur.k));
  }
  document.getElementById('sizes').innerHTML = SIZES.map(s => `<button data-k="${s.k}">${s.label}</button>`).join(' ');
  document.getElementById('sizes').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    cur = SIZES.find(s => s.k === b.dataset.k) || SIZES[0]; set(cur.k); fit();
  });
  document.getElementById('reload').onclick = () => { try { fr.contentWindow.location.reload(); } catch { fr.src = fr.src; } };
  addEventListener('resize', fit);
  fr.src = './?pv=1';
  fit();
</script>
</body>
</html>
