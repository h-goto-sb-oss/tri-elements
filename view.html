<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>表示の確認 ／ TRI-ELEMENTS</title>
<!-- 作者の確認用（10/29 博史さん「スマホで PC 用の横の画面を見たい」）：ゲームを中にもう1つ、PC の大きさ（1280×720 など）で開き、
     スマホの画面に入るように見た目だけ縮める。スマホを縦に持っているときは90度回す（スマホを左に倒して横にして見る）。
     中のゲームは同じ場所のデータ（セーブ）を使う。入口はタイトル画面の作者だけのボタン -->
<style>
  :root{--bg:#0a0f1c;--bar:#121a2e;--line:#2a3554;--ink:#dfe7f5;--sub:#8fa0bf;--on:#e3b04a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif}
  body{display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 8px;background:var(--bar);border-bottom:1px solid var(--line)}
  .bar button,.bar a{font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:#1c2742;border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .bar button.on{border-color:var(--on);color:var(--on)}
  .bar small{color:var(--sub);font-size:11px}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px}
  .box{position:relative}
  .frame{position:absolute;left:0;top:0;transform-origin:0 0;background:#000;box-shadow:0 0 0 1px #3a4560,0 10px 30px #000c}
  iframe{display:block;border:0;background:#000}
</style>
</head>
<body>
<div class="bar">
  <span id="sizes"></span>
  <button id="rot">回す：自動</button>
  <button id="reload">読み直す</button>
  <a href="./">戻る</a>
  <small id="info"></small>
</div>
<div class="stage" id="stage"><div class="box" id="box"><div class="frame" id="frame"><iframe id="fr" title="TRI-ELEMENTS" allow="autoplay; fullscreen"></iframe></div></div></div>
<script>
  // 中の画面の大きさ。PC は横長（16:9）、スマホは縦
  const SIZES = [
    { k: 'pc1280', w: 1280, h: 720, label: 'PC 1280×720' },
    { k: 'pc1600', w: 1600, h: 900, label: 'PC 1600×900' },
    { k: 'pc1920', w: 1920, h: 1080, label: 'PC 1920×1080' },
    { k: 'sp412', w: 412, h: 915, label: 'スマホ 412×915' },
  ];
  const ROT = ['auto', 'on', 'off'], ROT_JA = { auto: '回す：自動', on: '回す：する', off: '回す：しない' };
  const load = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, v); } catch { /* 覚えられなくても動く */ } };
  const fr = document.getElementById('fr'), frame = document.getElementById('frame'), box = document.getElementById('box'), stage = document.getElementById('stage');
  let cur = SIZES.find(s => s.k === load('te-viewsize', 'pc1280')) || SIZES[0];
  let rot = load('te-viewrot', 'auto');
  function fit() {
    fr.style.width = cur.w + 'px'; fr.style.height = cur.h + 'px';
    const r = stage.getBoundingClientRect(), aw = r.width - 12, ah = r.height - 12;
    // 自動：中が横長で、外（スマホ）が縦長なら回す
    const turn = rot === 'on' || (rot === 'auto' && cur.w > cur.h && aw < ah);
    const k = turn ? Math.min(aw / cur.h, ah / cur.w) : Math.min(aw / cur.w, ah / cur.h);
    // 回すとき：縮めてから右へ90度回し、左へはみ出た分を戻す（画面の上が、スマホの右の辺になる＝スマホを左に倒して見る）
    frame.style.transform = turn ? `translate(${cur.h * k}px,0) rotate(90deg) scale(${k})` : `scale(${k})`;
    box.style.width = (turn ? cur.h : cur.w) * k + 'px'; box.style.height = (turn ? cur.w : cur.h) * k + 'px';
    document.getElementById('info').textContent = `中 ${cur.w}×${cur.h}・${Math.round(k * 100)}%${turn ? '・回している（スマホを左に倒して見る）' : ''}`;
    document.querySelectorAll('#sizes button').forEach(b => b.classList.toggle('on', b.dataset.k === cur.k));
    document.getElementById('rot').textContent = ROT_JA[rot];
  }
  document.getElementById('sizes').innerHTML = SIZES.map(s => `<button data-k="${s.k}">${s.label}</button>`).join(' ');
  document.getElementById('sizes').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    cur = SIZES.find(s => s.k === b.dataset.k) || SIZES[0]; save('te-viewsize', cur.k); fit();
  });
  document.getElementById('rot').onclick = () => { rot = ROT[(ROT.indexOf(rot) + 1) % ROT.length]; save('te-viewrot', rot); fit(); };
  document.getElementById('reload').onclick = () => { try { fr.contentWindow.location.reload(); } catch { fr.src = fr.src; } };
  addEventListener('resize', fit);
  fr.src = './?view=1';
  fit();
</script>
</body>
</html>
